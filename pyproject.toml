[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freecad-mcp-bridge"
version = "0.1.0"
description = "A local MCP bridge between Copilot and FreeCAD."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
freecad-mcp-adapter = "adapter.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["adapter", "bridge", "freecad_addon"]
